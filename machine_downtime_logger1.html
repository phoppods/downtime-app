<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Machine Downtime Logger</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body{font-family:sans-serif;background:#f4f4f4;padding:20px}
.app{background:#fff;padding:20px;border-radius:10px;max-width:1000px;margin:auto}
input,select{margin:5px;padding:6px}
button{padding:6px 12px;margin-top:5px}
.badge.ongoing{color:red}
.badge.done{color:green}
</style>
</head>

<body>

<div class="app">
<h2>Machine Downtime Logger</h2>

<input id="fLine" placeholder="Line">
<input id="fMachine" placeholder="Machine">
<input id="fTech" placeholder="Technician">
<input id="fStart" type="datetime-local">
<input id="fEnd" type="datetime-local">

<select id="fReason">
<option value="">Reason</option>
<option>Mechanical failure</option>
<option>Electrical fault</option>
<option>PLC issue</option>
</select>

<input id="fNotes" placeholder="Notes">
<br>
<button onclick="addEvent()">+ Log</button>

<hr>

<div>
Total: <span id="mTotal">0</span> |
Ongoing: <span id="mOngoing">0</span> |
Machines: <span id="mMachines">0</span> |
Downtime: <span id="mHours">0h</span>
</div>

<hr>

<table border="1" width="100%">
<thead>
<tr>
<th>Machine</th>
<th>Start</th>
<th>End</th>
<th>Duration</th>
<th>Status</th>
</tr>
</thead>
<tbody id="logBody"></tbody>
</table>

<button onclick="exportExcel()">Export Excel</button>

</div>

<!-- MODAL -->
<div id="modalOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#0008">
<div style="background:#fff;padding:20px;margin:100px auto;width:300px">
<h3>End Task</h3>
<textarea id="mResNote" placeholder="Resolution note"></textarea><br>
<button onclick="confirmEnd()">Confirm</button>
<button onclick="closeModal()">Cancel</button>
</div>
</div>

<script>

// 🔥 API (สำคัญสุด)
const API = "https://downtime-app-erdp.onrender.com";

let events = [];
let pendingId = null;

// ================= LOAD =================
async function loadEvents(){
  try{
    const res = await fetch(`${API}/events`);
    events = await res.json();
    renderTable();
    updateMetrics();
  }catch(e){
    alert("Server error");
  }
}

// ================= ADD =================
async function addEvent(){
  const data = {
    line:fLine.value,
    machine:fMachine.value,
    tech:fTech.value,
    reason:fReason.value,
    start:fStart.value,
    end:fEnd.value,
    notes:fNotes.value
  };

  await fetch(`${API}/events`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(data)
  });

  loadEvents();
}

// ================= END =================
function openModal(id){
  pendingId=id;
  document.getElementById('modalOverlay').style.display='block';
}

function closeModal(){
  document.getElementById('modalOverlay').style.display='none';
}

async function confirmEnd(){
  const now=new Date().toISOString().slice(0,16);

  await fetch(`${API}/events/${pendingId}/end`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      end:now,
      resNote:mResNote.value
    })
  });

  closeModal();
  loadEvents();
}

// ================= FORMAT =================
function formatTime(t){
  return new Date(t).toLocaleString();
}

function calcDuration(s,e){
  const ms = new Date(e)-new Date(s);
  const m = Math.floor(ms/60000);
  return `${Math.floor(m/60)}h ${m%60}m`;
}

// ================= RENDER =================
function renderTable(){
  const tbody = document.getElementById('logBody');

  if(!events.length){
    tbody.innerHTML='<tr><td colspan="5">No data</td></tr>';
    return;
  }

  tbody.innerHTML = events.map(e=>{
    const ongoing = !e.end;

    return `
    <tr>
      <td>${e.machine}</td>
      <td>${formatTime(e.start)}</td>
      <td>${e.end?formatTime(e.end):'-'}</td>
      <td>${e.end?calcDuration(e.start,e.end):'-'}</td>
      <td>
        ${ongoing
          ? `<span class="badge ongoing">Ongoing</span>
             <button onclick="openModal(${e.id})">End</button>`
          : `<span class="badge done">Done</span>`
        }
      </td>
    </tr>`;
  }).join('');
}

// ================= METRICS =================
function updateMetrics(){
  const ongoing = events.filter(e=>!e.end);
  const completed = events.filter(e=>e.end);

  const totalMs = completed.reduce((s,e)=>s+(new Date(e.end)-new Date(e.start)),0);
  const machines = new Set(events.map(e=>e.machine)).size;

  mTotal.textContent = events.length;
  mOngoing.textContent = ongoing.length;
  mMachines.textContent = machines;

  const m = Math.floor(totalMs/60000);
  mHours.textContent = `${Math.floor(m/60)}h ${m%60}m`;
}

// ================= EXPORT =================
function exportExcel(){
  const ws = XLSX.utils.json_to_sheet(events);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "data");
  XLSX.writeFile(wb, "downtime.xlsx");
}

// ================= INIT =================
loadEvents();

</script>

</body>
</html>
