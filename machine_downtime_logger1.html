<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Machine Downtime Logger</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
/* ==== (UI เดิมคุณทั้งหมด ไม่เปลี่ยน) ==== */
body{font-family:system-ui;background:#f0f0ee;padding:20px}
.app{background:#fff;padding:20px;border-radius:10px}
.badge.ongoing{color:red}
.badge.done{color:green}
</style>
</head>

<body>

<div class="app">
<h2>Machine Downtime Logger</h2>

<input id="fLine" placeholder="Line">
<input id="fMachine" placeholder="Machine">
<input id="fTech" placeholder="Technician">
<input id="fStart" type="datetime-local">
<input id="fEnd" type="datetime-local">
<select id="fReason">
<option value="">Reason</option>
<option>Mechanical failure</option>
<option>Electrical fault</option>
</select>
<input id="fNotes" placeholder="Notes">

<button onclick="addEvent()">+ Log</button>

<hr>

<div>
Total: <span id="mTotal">0</span> |
Ongoing: <span id="mOngoing">0</span> |
Machines: <span id="mMachines">0</span> |
Downtime: <span id="mHours">0h</span>
</div>

<table border="1" width="100%">
<thead>
<tr>
<th>Machine</th><th>Start</th><th>End</th><th>Duration</th><th>Status</th>
</tr>
</thead>
<tbody id="logBody"></tbody>
</table>
</div>

<!-- MODAL -->
<div id="modalOverlay" style="display:none">
<textarea id="mResNote"></textarea>
<button onclick="confirmEnd()">Confirm</button>
<button onclick="closeModal()">Cancel</button>
</div>

<script>
const API = "https://downtime-app-erdp.onrender.com";

let events=[];
let pendingId=null;

// ================= LOAD =================
async function loadEvents(){
  try{
    const res = await fetch(`${API}/events`);
    events = await res.json();
    renderTable();
    updateMetrics();
  }catch(e){
    alert("Server error");
  }
}

// ================= ADD =================
async function addEvent(){
  const line=fLine.value;
  const machine=fMachine.value;
  const tech=fTech.value;
  const reason=fReason.value;
  const start=fStart.value;
  const end=fEnd.value;
  const notes=fNotes.value;

  await fetch(`${API}/events`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({line,machine,tech,reason,start,end,notes})
  });

  loadEvents();
}

// ================= MODAL =================
function openModal(id){
  pendingId=id;
  document.getElementById('modalOverlay').style.display='block';
}

function closeModal(){
  document.getElementById('modalOverlay').style.display='none';
}

// ================= END =================
async function confirmEnd(){
  const now=new Date().toISOString().slice(0,16);

  await fetch(`${API}/events/${pendingId}/end`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      end:now,
      resNote:document.getElementById('mResNote').value
    })
  });

  closeModal();
  loadEvents();
}

// ================= FORMAT =================
function formatTime(t){
  const d = new Date(t);
  return d.toLocaleString();
}

function calcDuration(start,end){
  const ms = new Date(end) - new Date(start);
  const m = Math.floor(ms/60000);
  return `${Math.floor(m/60)}h ${m%60}m`;
}

// ================= RENDER =================
function renderTable(){
  const tbody=document.getElementById('logBody');

  if(!events.length){
    tbody.innerHTML='<tr><td colspan="5">No data</td></tr>';
    return;
  }

  tbody.innerHTML=events.map(e=>{
    const ongoing = !e.end;

    return `
    <tr>
      <td>${e.machine}</td>
      <td>${formatTime(e.start)}</td>
      <td>${e.end ? formatTime(e.end) : '-'}</td>
      <td>${e.end ? calcDuration(e.start,e.end) : '-'}</td>
      <td>
        ${ongoing 
          ? `<span class="badge ongoing">Ongoing</span>
             <button onclick="openModal(${e.id})">End</button>`
          : `<span class="badge done">Done</span>`
        }
      </td>
    </tr>`;
  }).join('');
}

// ================= METRICS =================
function updateMetrics(){
  const ongoing = events.filter(e=>!e.end);
  const completed = events.filter(e=>e.end);

  const totalMs = completed.reduce((s,e)=>s+(new Date(e.end)-new Date(e.start)),0);
  const machines = new Set(events.map(e=>e.machine)).size;

  document.getElementById('mTotal').textContent = events.length;
  document.getElementById('mOngoing').textContent = ongoing.length;
  document.getElementById('mMachines').textContent = machines;

  const m = Math.floor(totalMs/60000);
  document.getElementById('mHours').textContent =
    `${Math.floor(m/60)}h ${m%60}m`;
}

// ================= EXPORT =================
function exportExcel(){
  const rows = events.map(e=>({
    machine:e.machine,
    start:e.start,
    end:e.end,
    status:e.end?'Done':'Ongoing'
  }));

  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "data");
  XLSX.writeFile(wb,"downtime.xlsx");
}

// ================= INIT =================
loadEvents();
</script>

</body>
</html>
